<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
  <defs>
    <style>
      .title { font: 700 40px 'Helvetica Neue', Arial, sans-serif; fill: #1c2753; }
      .subtitle { font: 400 22px 'Helvetica Neue', Arial, sans-serif; fill: #4a5568; }
      .card-title { font: 700 24px 'Helvetica Neue', Arial, sans-serif; fill: #1c2753; }
      .card-body { font: 400 18px 'Helvetica Neue', Arial, sans-serif; fill: #2d3748; line-height: 1.5; }
      .card { rx: 26; ry: 26; fill: #ffffff; stroke-width: 3; }
    </style>
  </defs>
  <rect x="0" y="0" width="1200" height="720" fill="#f3f6ff" rx="32" ry="32"/>
  <text x="600" y="90" text-anchor="middle" class="title">SpectrumPY Quicklook</text>
  <text x="600" y="135" text-anchor="middle" class="subtitle">Large-scale tools that keep IDEX science moving</text>

  <g transform="translate(100,190)">
    <rect class="card" stroke="#4263eb" x="0" y="0" width="460" height="210"/>
    <text x="32" y="60" class="card-title">Packet decommutation</text>
    <text x="32" y="106" class="card-body">
      <tspan x="32" dy="0">Convert raw XTCE telemetry into mission-ready</tspan>
      <tspan x="32" dy="24">HDF5 and CDF products. Downlink sessions are</tspan>
      <tspan x="32" dy="24">captured, verified, and staged for every</tspan>
      <tspan x="32" dy="24">analysis sprint.</tspan>
    </text>
  </g>

  <g transform="translate(640,190)">
    <rect class="card" stroke="#15aabf" x="0" y="0" width="460" height="210"/>
    <text x="32" y="60" class="card-title">Batch processing</text>
    <text x="32" y="106" class="card-body">
      <tspan x="32" dy="0">Shell workflows watch incoming telemetry, decode</tspan>
      <tspan x="32" dy="24">science events, and export quicklook plots so</tspan>
      <tspan x="32" dy="24">investigators can spot trends immediately.</tspan>
    </text>
  </g>

  <g transform="translate(100,430)">
    <rect class="card" stroke="#be4bdb" x="0" y="0" width="460" height="210"/>
    <text x="32" y="60" class="card-title">Fit adjustment</text>
    <text x="32" y="106" class="card-body">
      <tspan x="32" dy="0">Interactive overlays let you tune lmfit solutions</tspan>
      <tspan x="32" dy="24">on the fly, lock in overrides, and compare</tspan>
      <tspan x="32" dy="24">candidate fits without leaving the GUI workspace.</tspan>
    </text>
  </g>

  <g transform="translate(640,430)">
    <rect class="card" stroke="#fd7e14" x="0" y="0" width="460" height="210"/>
    <text x="32" y="60" class="card-title">TOF mass spectrometry</text>
    <text x="32" y="106" class="card-body">
      <tspan x="32" dy="0">Dedicated dust composition tools merge gain</tspan>
      <tspan x="32" dy="24">stages, fit EMG mass lines, and highlight</tspan>
      <tspan x="32" dy="24">abundance trends across the full time-of-flight</tspan>
      <tspan x="32" dy="24">spectrum.</tspan>
    </text>
  </g>
</svg>
