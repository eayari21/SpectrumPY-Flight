[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrumpy-flight"
version = "1.0.0"
description = "Ground-system decoding, fitting, and visualization tools for the LASP/IMPACT IDEX campaign."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "SpectrumPY Team" }]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "seaborn",
    "h5py",
    "lmfit",
    "bitstring",
    "cdflib",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt",
    "pytest-cov",
]

[project.scripts]
spectrumpy-flight = "spectrumpy_flight.start:main"
spectrumpy-launcher = "spectrumpy_flight.spectrum_launcher:main"
spectrumpy-quicklook = "spectrumpy_flight.idex_quicklook:main"
spectrumpy-scope-quicklook = "spectrumpy_flight.scope_idex_quicklook:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
